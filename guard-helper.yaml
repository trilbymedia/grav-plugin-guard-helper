enabled: false

# Guard Cloud base URL the agent is downloaded from and pairs with. This is
# trust-critical (the signed release is fetched from here), so it's set in
# config only — never accepted from a request.
cloud_url: 'https://cloud.gravguard.com'

# Frontend route that serves the browser-only agent setup page (super-admin only).
setup_route: '/_guard-setup'

# Where users without a Guard Cloud account are sent to sign up (free). Shown on
# the setup panel — especially after install, when the pairing code is ready.
signup_url: 'https://gravguard.com'

# Grav's scheduler webhook, for Guard Cloud's scheduler. Most hosts don't let
# the agent start Grav from a web request, so its only way to run the site's
# scheduled jobs there is the webhook. When true, installing or re-pairing the
# agent switches it on in user/config/scheduler.yaml with a random token
# (keeping any token already set), and the plugin answers /scheduler/webhook
# itself when the scheduler-webhook plugin is not enabled. false stops both,
# and leaves the scheduler settings as they are.
scheduler_webhook: true
