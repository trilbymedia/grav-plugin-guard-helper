enabled: false

# Guard Cloud base URL the agent is downloaded from and pairs with. This is
# trust-critical (the signed release is fetched from here), so it's set in
# config only — never accepted from a request.
cloud_url: 'https://gravguard.com'

# Frontend route that serves the browser-only agent setup page (super-admin only).
setup_route: '/_guard-setup'

# Where users without a Guard Cloud account are sent to sign up (free). Shown on
# the setup panel — especially after install, when the pairing code is ready.
signup_url: 'https://gravguard.com'

# Guard Shield — endpoint-WAF virtual patching. Rules are fetched from the cloud
# as a signed bundle and applied ONLY if the Ed25519 signature verifies against
# public_key, so a compromised CDN can't inject a rule. Off by default; set the
# public key (from bin/shield-keygen.php) and enable to turn it on.
shield:
  enabled: false
  public_key: ''
