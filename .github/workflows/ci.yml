name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Validate YAML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('blueprints.yaml')); yaml.safe_load(open('guard-helper.yaml')); yaml.safe_load(open('languages.yaml'))"

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, zip, pdo_sqlite
          coverage: none
      # Composer's own download cache, so a green run stops depending on
      # codeload being reachable for every package on every run. Keyed on the
      # manifest: agent and helper do not commit composer.lock, so hashFiles
      # falls back to composer.json alone, and restore-keys still supplies a
      # warm partial cache when that changes.
      - name: Locate the composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        # Authenticated so composer is counted as somebody rather than as
        # anonymous traffic, which raises codeload's limit by orders of
        # magnitude. It grants nothing extra — the packages are public.
        #
        # Be clear about what it does NOT fix. This went in blaming three
        # repos pushed at once for exhausting a shared limit; the real
        # cause was a GitHub outage 429ing everybody, and the next run
        # proved it by failing identically WITH the token applied. This
        # helps with ordinary rate limiting, not with codeload being down.
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --no-progress
      - name: Test
        run: composer test
        # The full install/pair integration test skips when the sibling agent
        # source isn't checked out (i.e. in this repo's standalone CI); the
        # release-verification tests still run.
