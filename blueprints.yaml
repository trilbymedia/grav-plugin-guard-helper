name: Guard Helper
slug: guard-helper
type: plugin
testing: true
version: 0.2.0-beta.2
description: Optional companion plugin for Grav Guard — in-admin health checker, SSO token consumption, and Guard Shield hooks. The Guard control channel never depends on this plugin.
icon: shield
author:
  name: Trilby Media
  email: hello@trilbymedia.com
homepage: https://github.com/trilbymedia/grav-plugin-guard-helper
keywords: guard, security, monitoring, backup
bugs: https://github.com/trilbymedia/grav-plugin-guard-helper/issues
docs: https://github.com/trilbymedia/grav-plugin-guard-helper/blob/main/README.md
license: MIT

# Advertised to GPM. Omitting it means 1.7, which is the baseline every
# package predating this key correctly still has; declaring it is how a
# plugin says it ALSO runs on a later generation.
#
# Both generations on purpose: the plugin drives admin2 component pages
# where they exist and falls back to a classic admin menu entry, widget and
# frontend route where they do not. Guard protects 1.7 sites, so its
# companion plugin has to reach them.
compatibility:
  grav: ['1.7', '2.0']

dependencies:
  - { name: grav, version: ">=1.7.51" }
  - { name: php, version: ">=8.1" }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    cloud_url:
      type: text
      label: Guard Cloud URL
      help: Trust-critical — the signed agent release is downloaded from here and the site pairs with it.
      default: 'https://gravguard.com'
    setup_route:
      type: text
      label: Setup page route
      help: Frontend route serving the browser-only agent setup page (super-admin only).
      default: '/_guard-setup'
    signup_url:
      type: text
      label: Guard Cloud signup URL
      help: Where users without a Guard Cloud account are sent to sign up free. Shown on the setup panel.
      default: 'https://gravguard.com'
