name: Guard Helper
slug: guard-helper
type: plugin
version: 0.1.0
description: Optional companion plugin for Grav Guard — in-admin health checker, SSO token consumption, and Guard Shield hooks. The Guard control channel never depends on this plugin.
icon: shield
author:
  name: Trilby Media
  email: hello@trilbymedia.com
homepage: https://github.com/trilbymedia/grav-plugin-guard-helper
keywords: guard, security, monitoring, backup
bugs: https://github.com/trilbymedia/grav-plugin-guard-helper/issues
docs: https://github.com/trilbymedia/grav-plugin-guard-helper/blob/main/README.md
license: MIT

dependencies:
  - { name: grav, version: '>=2.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
